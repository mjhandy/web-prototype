<div class="container mt-5 mb-5">
  <div class="row">
    <div class="col-12 d-flex justify-content-center">
      <h1>Packages</h1>
    </div>
  </div>
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8 d-flex justify-content-center">
      <div class="d-flex flex-row packages w-100">
        @for ( package of packages; track package; let i = $index){
          <a href="{{ package.detailURL }}" fragement="" class="d-flex flex-column flex-fill package" [class]="   package.flag ? 'highlight ' : ''">
            <div class="package-header" [class]="'p' + $index">
              <h3>{{ package.title }}</h3>
            </div>
            <div class="package-body" >
              <p>{{ package.description }}</p>
              <ul>
                @for (point of package.points; track point){
                  <li>{{ point.point }}</li>
                }
              </ul>
            </div>
            <div class="package-footer">              
            </div>
          </a>
        }
      </div>
    </div>
  </div>
</div>
