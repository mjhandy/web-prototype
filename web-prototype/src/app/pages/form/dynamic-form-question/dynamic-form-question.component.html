<div [formGroup]="form">
  <label [attr.for]="question.key">{{ question.label }} <span class="required">*</span></label>
  <div>
    @switch (question.controlType) {
      @case ('textbox') {
        <input [formControlName]="question.key" [id]="question.key" [type]="question.type" class="form-control">
      } @case ('dropdown') {
        <select [id]="question.key" [formControlName]="question.key" class="form-control">
        @for (opt of question.options; track opt) {
          <option [value]="opt.key">{{ opt.value }}</option>
        }
        </select>
      }
    }
  </div>
  @if (!isValid) {<div class="errorMessage">{{ question.label }} is required</div>}
</div>
