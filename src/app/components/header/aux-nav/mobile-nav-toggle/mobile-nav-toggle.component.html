
<button 
  class="navbar-toggler" 
  #navToggle
  id="navToggle"
  type="button" 
  data-bs-toggle="offcanvas" 
  data-bs-target="#mainNav" 
  aria-controls="mainNav" 
  aria-expanded="false" 
  aria-label="Open navigation"
  matRipple 
  (click)="menu()">
  <mat-icon>{{ menuOpenIcon }}</mat-icon>
</button>
