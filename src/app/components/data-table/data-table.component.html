<mat-table
  
  matSort 
  #tbSort="matSort"
  [dataSource]="dataSource" 
  (matSortChange)="announceSortChange($event)" 
  class="table table-default"> 

  <!-- Name Column -->
  <ng-container matColumnDef="col-name">
    <mat-header-cell *matHeaderCellDef mat-sort-header="name" sortActionDescription="Sort by Name">
      Name
    </mat-header-cell>
    <mat-cell *matCellDef="let sales">
      {{sales.name}}
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="col-sales">
    <mat-header-cell *matHeaderCellDef mat-sort-header="sales" sortActionDescription="Sort by Sales">
      Sales
    </mat-header-cell>
    <mat-cell *matCellDef="let sales">
      {{sales.saleTotal | currency}}
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="col-department"> 
    <mat-header-cell *matHeaderCellDef  mat-sort-header="de" sortActionDescription="Sort by Department">
      Department
    </mat-header-cell>
    <mat-cell *matCellDef="let sales"> 
      {{sales.department}} 
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="displayColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayColumns;"></mat-row>

</mat-table>
