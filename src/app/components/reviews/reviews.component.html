@for (review of jsonData; track review){
  <div class="review">
    <div class="review-profile">
      <img src="{{ review.headShot }}" width="64px" height="64px">
      <p class="name">{{ review.first}}</p>
      <p>{{ review.city}}, {{ review.country}}</p>

      <aap-review-stars [displayMode]="review" reviewCount="{{ review.rating}}"></aap-review-stars>
    </div>
    <div class="review-body" [innerHTML]="review.review"></div>
  </div>
}
