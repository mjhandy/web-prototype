<nav class="sideNav">
    <ul  class="sideNav-nav">
      @for ( route of routes; track $index )
      {
        <li  class="sideNav-item" routerLinkActive="active">
          <a
          class="sideNav-link" 
            [routerLink]="'/' + [route.path]" 
            routerLinkActive="active">
              {{ route.data?.['label'] | translate }}
          </a>
          @if ( route.children )
          {
            <ul>
              @for ( child of route.children; track $index )
              {
                <li>
                  <a 
                  class="nav-link"
                    [routerLink]="'/' + [child.path]" 
                    routerLinkActive="active">
                      {{ child.data?.['label'] | translate }}
                  </a>
                </li>
              }
            </ul>
          }
        </li>
      }
    </ul>
  </nav>
